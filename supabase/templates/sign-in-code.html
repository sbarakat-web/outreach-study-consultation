<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#172554">
  <img src="https://consultation.outreachstudy.eu/logo.png" alt="Outreach" width="180" style="display:block;margin-bottom:24px">
  <h2 style="margin:0 0 8px">Your sign-in code</h2>
  <p style="margin:0 0 20px;color:#475569">Enter this code to open your Outreach dashboard:</p>
  <p style="font-size:34px;font-weight:bold;letter-spacing:8px;background:#f4f7fb;border-radius:12px;padding:16px;text-align:center;margin:0 0 20px">{{ .Token }}</p>
  <p style="margin:0 0 20px;color:#475569">Or open your dashboard directly:</p>
  <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#172554;color:#ffffff;padding:12px 24px;border-radius:999px;text-decoration:none;font-weight:bold">Open my dashboard</a></p>
  <p style="margin:0;font-size:12px;color:#94a3b8">The code expires in 1 hour. If you didn't request it, you can ignore this email.</p>
</div>
